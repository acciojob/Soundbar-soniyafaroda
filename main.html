<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Soundbar</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <h1>Soundbar</h1>

    <!-- Buttons container (required id) -->
    <section id="buttons" class="buttons-area">
      <!-- Buttons will be created here by script.js -->
    </section>

    <!-- Stop button should have class "stop" (requirement) -->
    <div class="controls">
      <button class="stop" id="stopBtn">STOP</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
